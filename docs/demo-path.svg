<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="typeClip">
      <rect x="36" y="60" height="24" width="0">
        <animate attributeName="width" dur="11s" repeatCount="indefinite"
                 values="0;0;330;330;330" keyTimes="0;0.02;0.17;0.96;1"/>
      </rect>
    </clipPath>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="420" rx="14" fill="#0b1210"/>
  <rect x="1" y="1" width="998" height="418" rx="14" fill="none" stroke="#1d3a32" stroke-width="1.5"/>

  <!-- title bar -->
  <circle cx="34" cy="34" r="7" fill="#ff5f57"/>
  <circle cx="56" cy="34" r="7" fill="#febc2e"/>
  <circle cx="78" cy="34" r="7" fill="#28c840"/>
  <text x="404" y="39" text-anchor="end" font-size="14" fill="#4b6d63">governed-triage-graph</text>
  <line x1="420" y1="18" x2="420" y2="402" stroke="#1d3a32" stroke-width="1.5"/>

  <!-- ── left pane: terminal ───────────────────────────────────────── -->
  <g font-size="15">
    <text x="36" y="78" fill="#5eead4">$</text>
    <g clip-path="url(#typeClip)">
      <text x="54" y="78" fill="#d6e5e0">graphify path "ingress()" "audit()"</text>
    </g>
    <rect x="54" y="62" width="8" height="19" fill="#5eead4">
      <animate attributeName="x" dur="11s" repeatCount="indefinite"
               values="54;54;384;384;384" keyTimes="0;0.02;0.17;0.96;1"/>
      <animate attributeName="opacity" dur="1s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.5;0.51;1"/>
    </rect>

    <text x="36" y="122" fill="#7f9a92">Shortest path (4 hops):
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
               values="0;0;1;1;0" keyTimes="0;0.21;0.23;0.96;1"/>
    </text>

    <text x="36" y="158" fill="#5eead4">ingress()
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
               values="0;0;1;1;0" keyTimes="0;0.27;0.29;0.96;1"/>
    </text>
    <text x="52" y="188" fill="#7f9a92">--conditional--&gt; <tspan fill="#5eead4">retrieve()</tspan>
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
               values="0;0;1;1;0" keyTimes="0;0.37;0.39;0.96;1"/>
    </text>
    <text x="52" y="218" fill="#7f9a92">--state--&gt; <tspan fill="#5eead4">classify()</tspan>
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
               values="0;0;1;1;0" keyTimes="0;0.47;0.49;0.96;1"/>
    </text>
    <text x="52" y="248" fill="#7f9a92">--conditional--&gt; <tspan fill="#5eead4">route()</tspan>
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
               values="0;0;1;1;0" keyTimes="0;0.57;0.59;0.96;1"/>
    </text>
    <text x="52" y="278" fill="#7f9a92">--conditional--&gt; <tspan fill="#5eead4">audit()</tspan>
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
               values="0;0;1;1;0" keyTimes="0;0.67;0.69;0.96;1"/>
    </text>

    <text x="36" y="330" font-size="12.5" fill="#c9a227">gate_a() is not a node on this path
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
               values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.96;1"/>
    </text>
    <text x="36" y="350" font-size="12.5" fill="#6b8078">it is the condition on classify -&gt; route
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
               values="0;0;1;1;0" keyTimes="0;0.77;0.79;0.96;1"/>
    </text>
    <text x="36" y="384" font-size="11.5" fill="#4b6d63">edges injected by merge_langgraph_topology.py
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
               values="0;0;1;1;0" keyTimes="0;0.84;0.86;0.96;1"/>
    </text>
  </g>

  <!-- ── right pane: graph ─────────────────────────────────────────── -->
  <g>
    <!-- non-path edges, always faint -->
    <g stroke="#24413a" stroke-width="1.6" fill="none">
      <line x1="520" y1="120" x2="560" y2="300"/>
      <line x1="760" y1="140" x2="560" y2="300"/>
      <line x1="880" y1="215" x2="900" y2="325"/>
      <line x1="900" y1="325" x2="790" y2="315"/>
    </g>

    <!-- path edges, lighting in sequence -->
    <g stroke="#5eead4" stroke-width="2.6" fill="none" filter="url(#glow)">
      <line x1="520" y1="120" x2="640" y2="95" opacity="0">
        <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
                 values="0;0;1;1;0" keyTimes="0;0.37;0.40;0.96;1"/>
      </line>
      <line x1="640" y1="95" x2="760" y2="140" opacity="0">
        <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
                 values="0;0;1;1;0" keyTimes="0;0.47;0.50;0.96;1"/>
      </line>
      <line x1="760" y1="140" x2="880" y2="215" opacity="0">
        <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
                 values="0;0;1;1;0" keyTimes="0;0.57;0.60;0.96;1"/>
      </line>
      <line x1="880" y1="215" x2="790" y2="315" opacity="0">
        <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
                 values="0;0;1;1;0" keyTimes="0;0.67;0.70;0.96;1"/>
      </line>
    </g>

    <!-- gate_a marker on the classify -> route edge -->
    <g opacity="0">
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
               values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.96;1"/>
      <circle cx="820" cy="177" r="6" fill="#0b1210" stroke="#c9a227" stroke-width="2"/>
      <text x="832" y="174" font-size="11.5" fill="#c9a227">gate_a</text>
    </g>

    <!-- off-path nodes -->
    <g font-size="12" fill="#5d7a71">
      <circle cx="560" cy="300" r="6" fill="#2b4a42"/>
      <text x="500" y="324">escalate_ungrounded</text>
      <circle cx="900" cy="325" r="6" fill="#2b4a42"/>
      <text x="858" y="349">gate_b_halt</text>
    </g>

    <!-- path nodes -->
    <g>
      <g opacity="0">
        <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
                 values="0;0;1;1;0" keyTimes="0;0.27;0.29;0.96;1"/>
        <circle cx="520" cy="120" r="8" fill="#5eead4" filter="url(#glow)"/>
        <text x="490" y="100" font-size="13" font-weight="bold" fill="#d6e5e0">ingress</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
                 values="0;0;1;1;0" keyTimes="0;0.37;0.39;0.96;1"/>
        <circle cx="640" cy="95" r="8" fill="#5eead4" filter="url(#glow)"/>
        <text x="612" y="75" font-size="13" font-weight="bold" fill="#d6e5e0">retrieve</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
                 values="0;0;1;1;0" keyTimes="0;0.47;0.49;0.96;1"/>
        <circle cx="760" cy="140" r="8" fill="#5eead4" filter="url(#glow)"/>
        <text x="734" y="120" font-size="13" font-weight="bold" fill="#d6e5e0">classify</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
                 values="0;0;1;1;0" keyTimes="0;0.57;0.59;0.96;1"/>
        <circle cx="880" cy="215" r="8" fill="#5eead4" filter="url(#glow)"/>
        <text x="900" y="211" font-size="13" font-weight="bold" fill="#d6e5e0">route</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
                 values="0;0;1;1;0" keyTimes="0;0.67;0.69;0.96;1"/>
        <circle cx="790" cy="315" r="8" fill="#5eead4" filter="url(#glow)"/>
        <text x="756" y="341" font-size="13" font-weight="bold" fill="#d6e5e0">audit</text>
      </g>
    </g>
  </g>
</svg>
