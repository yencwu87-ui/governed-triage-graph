<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="g" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="470" rx="14" fill="#0b1210"/>
  <rect x="1" y="1" width="998" height="468" rx="14" fill="none" stroke="#1d3a32" stroke-width="1.5"/>
  <circle cx="34" cy="32" r="7" fill="#ff5f57"/>
  <circle cx="56" cy="32" r="7" fill="#febc2e"/>
  <circle cx="78" cy="32" r="7" fill="#28c840"/>
  <text x="412" y="37" text-anchor="end" font-size="13" fill="#4b6d63">governed-triage-graph — gate B</text>
  <line x1="428" y1="16" x2="428" y2="454" stroke="#1d3a32" stroke-width="1.5"/>

  <!-- ══ left: event log ══════════════════════════════════════════ -->
  <g font-size="13.5">
    <text x="36" y="76" fill="#7f9a92">ticket T-2 <tspan fill="#d6e5e0">"checkout down for all customers"</tspan>
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.03;0.05;0.96;1"/></text>

    <text x="36" y="108" fill="#5eead4">ingress <tspan fill="#7f9a92">degraded=False  precedent_depth=1</tspan>
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.10;0.12;0.96;1"/></text>

    <text x="36" y="136" fill="#5eead4">retrieve <tspan fill="#7f9a92">1 precedent · 1 policy clause</tspan>
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.17;0.19;0.96;1"/></text>

    <text x="36" y="164" fill="#5eead4">classify <tspan fill="#d6e5e0">high</tspan> <tspan fill="#7f9a92">@ confidence 0.91</tspan>
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.24;0.26;0.96;1"/></text>

    <text x="36" y="192" fill="#c9a227">gate A <tspan fill="#7f9a92">0.91 &gt;= 0.75 floor → proceed</tspan>
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.31;0.33;0.96;1"/></text>

    <text x="36" y="220" fill="#5eead4">route <tspan fill="#7f9a92">IT Support</tspan>
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.38;0.40;0.96;1"/></text>

    <!-- the halt -->
    <g>
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.45;0.47;0.96;1"/>
      <rect x="30" y="238" width="372" height="52" rx="7" fill="#231a06" stroke="#c9a227" stroke-width="1.6"/>
      <text x="44" y="262" font-size="14" font-weight="bold" fill="#febc2e">GATE B — EXECUTION SUSPENDED</text>
      <text x="44" y="281" font-size="12" fill="#a08b4a">state checkpointed · nothing proceeds</text>
    </g>
    <text x="44" y="312" font-size="12.5" fill="#6b8078">waiting
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite"
               values="0;0;1;0.25;1;0.25;1;1;0" keyTimes="0;0.47;0.49;0.52;0.55;0.58;0.61;0.96;1"/></text>

    <text x="36" y="346" fill="#5eead4">resumed <tspan fill="#7f9a92">by duty_mgr_A · high → </tspan><tspan fill="#d6e5e0">medium</tspan>
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.64;0.66;0.96;1"/></text>

    <text x="36" y="378" font-size="12.5" fill="#7f9a92">audit_flags
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.71;0.73;0.96;1"/></text>
    <text x="52" y="398" font-size="12" fill="#ff8b7d">human_overrode_machine
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.74;0.76;0.96;1"/></text>
    <text x="52" y="416" font-size="12" fill="#ff8b7d">human_disagreed
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.77;0.79;0.96;1"/></text>
    <text x="52" y="434" font-size="12" fill="#7f9a92">+ 5 uncalibrated-threshold flags
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.80;0.82;0.96;1"/></text>
  </g>

  <!-- ══ right: the graph ═════════════════════════════════════════ -->
  <g>
    <g stroke="#24413a" stroke-width="1.6" fill="none">
      <line x1="530" y1="90" x2="650" y2="90"/>
      <line x1="650" y1="90" x2="770" y2="150"/>
      <line x1="770" y1="150" x2="880" y2="240"/>
      <line x1="880" y1="240" x2="800" y2="345"/>
      <line x1="800" y1="345" x2="640" y2="380"/>
      <line x1="530" y1="90" x2="560" y2="250"/>
      <line x1="770" y1="150" x2="560" y2="250"/>
    </g>

    <!-- lit path segments -->
    <g stroke="#5eead4" stroke-width="2.6" fill="none" filter="url(#g)">
      <line x1="530" y1="90" x2="650" y2="90" opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.17;0.19;0.96;1"/></line>
      <line x1="650" y1="90" x2="770" y2="150" opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.24;0.26;0.96;1"/></line>
      <line x1="770" y1="150" x2="880" y2="240" opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.38;0.40;0.96;1"/></line>
    </g>
    <line x1="880" y1="240" x2="800" y2="345" stroke="#c9a227" stroke-width="2.6" opacity="0" filter="url(#g)">
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.45;0.47;0.96;1"/></line>
    <line x1="800" y1="345" x2="640" y2="380" stroke="#5eead4" stroke-width="2.6" opacity="0" filter="url(#g)">
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.71;0.73;0.96;1"/></line>

    <!-- gate A marker on classify -> route -->
    <g opacity="0">
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.31;0.33;0.96;1"/>
      <circle cx="825" cy="195" r="6" fill="#0b1210" stroke="#c9a227" stroke-width="2"/>
      <text x="837" y="192" font-size="11" fill="#c9a227">gate A</text>
    </g>

    <!-- escalate branch, never taken in this run -->
    <circle cx="560" cy="250" r="6" fill="#2b4a42"/>
    <text x="466" y="272" font-size="11.5" fill="#4b6d63">escalate_ungrounded</text>

    <!-- nodes -->
    <g font-size="12.5" font-weight="bold" fill="#d6e5e0">
      <g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.10;0.12;0.96;1"/>
        <circle cx="530" cy="90" r="8" fill="#5eead4" filter="url(#g)"/><text x="502" y="70">ingress</text></g>
      <g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.17;0.19;0.96;1"/>
        <circle cx="650" cy="90" r="8" fill="#5eead4" filter="url(#g)"/><text x="622" y="70">retrieve</text></g>
      <g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.24;0.26;0.96;1"/>
        <circle cx="770" cy="150" r="8" fill="#5eead4" filter="url(#g)"/><text x="744" y="132">classify</text></g>
      <g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.38;0.40;0.96;1"/>
        <circle cx="880" cy="240" r="8" fill="#5eead4" filter="url(#g)"/><text x="900" y="236">route</text></g>

      <!-- gate B: halts, pulses while waiting, releases on resume -->
      <g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.45;0.47;0.96;1"/>
        <circle cx="800" cy="345" r="20" fill="none" stroke="#febc2e" stroke-width="2">
          <animate attributeName="r" dur="15s" repeatCount="indefinite" values="10;10;26;10;26;10;26;10;10" keyTimes="0;0.47;0.51;0.55;0.59;0.62;0.64;0.66;1"/>
          <animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;0.9;0;0.9;0;0.9;0;0" keyTimes="0;0.47;0.51;0.55;0.59;0.62;0.64;0.66;1"/>
        </circle>
        <circle cx="800" cy="345" r="9" fill="#febc2e" filter="url(#g)"/>
        <text x="762" y="326" fill="#febc2e">gate_b_halt</text>
      </g>

      <g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.71;0.73;0.96;1"/>
        <circle cx="640" cy="380" r="8" fill="#5eead4" filter="url(#g)"/><text x="614" y="404">audit</text></g>
    </g>

    <!-- human marker -->
    <g opacity="0">
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.64;0.66;0.96;1"/>
      <text x="836" y="368" font-size="11.5" fill="#d6e5e0">duty_mgr_A</text>
      <text x="836" y="384" font-size="11.5" fill="#ff8b7d">override</text>
    </g>
  </g>

  <text x="36" y="458" font-size="10.5" fill="#3f5c54">classifier substituted for this capture · GATE_A_FLOOR set to 0.75 · as shipped it is None and every ticket escalates</text>
</svg>
